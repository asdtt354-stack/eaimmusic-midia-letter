<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>에임뮤직-미디어-레터 — EAIM</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdfbf6;
  --surface:#ffffff;
  --surface2:#f2eafb;
  --accent:#6a2fe0;
  --accent2:#d1206b;
  --accent3:#00738a;
  --gold:#7a5312;
  --green:#1f6144;
  --text:#170f22;
  --text2:#463a5a;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;display:flex;align-items:center;justify-content:center}

.orb{position:fixed;border-radius:50%;pointer-events:none;filter:blur(80px);opacity:.18;z-index:0}
.orb1{width:520px;height:520px;top:-120px;left:-120px;background:var(--accent)}
.orb2{width:420px;height:420px;bottom:-120px;right:-60px;background:var(--accent2)}
.orb3{width:320px;height:320px;top:35%;left:42%;background:var(--accent3)}

.container{position:relative;z-index:1;max-width:640px;width:100%;padding:32px 20px 60px;text-align:center}

.header-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 18px;border-radius:20px;background:rgba(124,77,255,.14);border:1.5px solid rgba(124,77,255,.5);font-size:13px;color:var(--accent);letter-spacing:3px;font-weight:700;margin-bottom:20px}
.header-title{font-family:'Black Han Sans',sans-serif;font-size:clamp(36px,9vw,60px);line-height:1.15;letter-spacing:-1px;background:linear-gradient(135deg,#7c4dff 0%,#e8508a 55%,#0097ae 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:14px}
.header-sub{font-size:16px;color:var(--text2);line-height:1.8;margin-bottom:40px;font-weight:500}

.nav-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px}
@media(max-width:520px){.nav-grid{grid-template-columns:1fr}}
.nav-card{background:var(--surface);border:2px solid rgba(124,77,255,.3);border-radius:var(--radius);padding:28px 20px;text-decoration:none;color:var(--text);transition:all .25s;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 3px 14px rgba(45,36,56,.06);position:relative;overflow:hidden}
.nav-card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#7c4dff,#c778dd);}
.nav-card:hover{transform:translateY(-3px);border-color:rgba(124,77,255,.5);box-shadow:0 10px 28px rgba(124,77,255,.18)}
.nav-card .icon{font-size:44px}
.nav-card .title{font-size:20px;font-weight:800;color:#4a1f9e}
.nav-card .desc{font-size:14px;color:var(--text2);line-height:1.7;font-weight:500}
.nav-card.green::before{background:linear-gradient(90deg,#1f6144,#2e9c66);}
.nav-card.green .title{color:var(--green);font-weight:800;}
.nav-card.green:hover{border-color:rgba(31,97,68,.6);box-shadow:0 10px 28px rgba(31,97,68,.22)}

.session-quick{background:var(--surface);border:1.5px solid rgba(124,77,255,.14);border-radius:var(--radius);padding:18px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 10px rgba(45,36,56,.05)}
.session-quick label{font-size:14px;color:var(--text2);letter-spacing:1px;white-space:nowrap;font-weight:600}
.session-quick input{flex:1;min-width:140px;background:var(--surface2);border:1.5px solid rgba(124,77,255,.3);color:var(--text);padding:10px 14px;border-radius:8px;font-size:15px;font-family:inherit;outline:none}
.session-quick input:focus{border-color:var(--green)}
.session-quick button{padding:10px 20px;border-radius:8px;border:none;cursor:pointer;font-size:15px;font-weight:700;font-family:inherit;background:linear-gradient(135deg,#2e7d5a,#52c27a);color:#fff}

.footer-tag{margin-top:28px;font-size:11px;color:rgba(45,36,56,.3);letter-spacing:2px}
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="container">
  <div class="header-badge">🎵 EAIM</div>
  <div class="header-title">에임뮤직-미디어-레터</div>
  <div class="header-sub">음악을 듣고 · 느끼고 · 그림으로 표현하고 · 이야기로 완성하다<br>학급 코드 하나로 여러 기기의 장면이 한곳에 모여요</div>

  <div class="nav-grid">
    <a class="nav-card" href="media_picture.html">
      <div class="icon">🎨</div>
      <div class="title">미디어픽쳐</div>
      <div class="desc">음악 감상 → 이미지 생성 · 손그림 스케치 →<br>장면 만들기</div>
    </a>
    <a class="nav-card green" href="slideshow.html">
      <div class="icon">🎬</div>
      <div class="title">슬라이드쇼</div>
      <div class="desc">모아진 장면들을<br>영화처럼 감상하기</div>
    </a>
  </div>

  <div class="session-quick">
    <label>학급 코드로 바로 입장</label>
    <input id="quick-session" placeholder="예: 3-1-바람의빛깔">
    <button onclick="quickEnter()">미디어픽쳐로 이동</button>
  </div>

  <div class="footer-tag">Emotion · Artscape · Interactive · Musicalization</div>
</div>

<script>
window.addEventListener('load', () => {
  const saved = localStorage.getItem('eaim_session_code');
  if (saved) document.getElementById('quick-session').value = saved;
});
function quickEnter() {
  const v = document.getElementById('quick-session').value.trim();
  if (v) localStorage.setItem('eaim_session_code', v);
  window.location.href = 'media_picture.html';
}
</script>
</body>
</html>
